name: Deploy (DEV)
on:
  workflow_dispatch:
    inputs:
      deploy_web:
        description: 'Deploy Web Server?'
        type: boolean
        default: true
      deploy_scraper:
        description: 'Deploy Scraper Job?'
        type: boolean
        default: true
      reason:
        description: 'Why are we deploying?'
        required: false
        default: 'Regular update'
  push:
    branches: [ main ]
    paths:
      - 'backend/web-server/**'
      - 'backend/scraper/**'
      - 'backend/shared/**'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Env File from Secret
        run: |
          echo "${{ secrets.BACKEND_ENV_DEV }}" > backend/env.yaml
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-actions-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: 'Copy Web Server Dockerfile'
        if: contains(github.event.head_commit.modified, 'backend/web-server/') || ${{ github.event.inputs.deploy_web == 'true' }}
        run: cp backend/web-server/Dockerfile backend/Dockerfile

      # Deploy Web Server
      - name: 'Deploy Web Server (Dev)'
        if: contains(github.event.head_commit.modified, 'backend/web-server/') || ${{ github.event.inputs.deploy_web == 'true' }}
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'backend-dev'
          source: './backend' # include all backend to include shared libs
          region: 'europe-southwest1' # web server is in europe-southwest1
          env_vars_file: 'backend/env.yaml'

      # Deploy Scraper (Job)
      - name: 'Deploy Scraper Job'
        if: contains(github.event.head_commit.modified, 'backend/scraper/') || ${{ github.event.inputs.deploy_scraper == 'true' }}
        run: |  # scraper is in europe-west1 
          cp backend/scraper/Dockerfile backend/Dockerfile
          gcloud run jobs deploy scraper-job-dev \
            --source ./backend \
            --region europe-west1 \
            --env-vars-file backend/env.yaml \
            --quiet
