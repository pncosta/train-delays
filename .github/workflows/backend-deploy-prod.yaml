name: Backend Deploy (PROD)
on:
  workflow_dispatch: 
    inputs:
      deploy_web:
        description: 'Deploy Web Server?'
        type: boolean
        default: true
      deploy_scraper:
        description: 'Deploy Scraper Job?'
        type: boolean
        default: true
      reason:
        description: 'Why are we deploying?'
        required: false
        default: 'Regular update'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Env File from Secret
        run: |
          echo "${{ secrets.BACKEND_ENV_PROD }}" > backend/env.yaml     
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-actions-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: 'Deploy Web Server (PROD)'
        if: ${{ github.event.inputs.deploy_web == 'true' }}
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'backend-prod'
          region: 'europe-southwest1'
          source: './backend/web-server'
          env_vars_file: 'backend/env.yaml'
      
      - name: 'Deploy Scraper Job (PROD)'
        if: ${{ github.event.inputs.deploy_scraper == 'true' }}
        run: |
          gcloud run jobs deploy scraper-job-prod \
            --source ./backend/scraper \
            --region europe-west1 \
            --env-vars-file backend/env.yaml \
            --quiet