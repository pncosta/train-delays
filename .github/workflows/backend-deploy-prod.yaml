name: Deploy (PROD)
on:
  workflow_dispatch:
    inputs:
      deploy_web:
        description: 'Deploy Web Server?'
        type: boolean
        default: true
      deploy_scraper:
        description: 'Deploy Scraper Job?'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy Frontend?'
        type: boolean
        default: true
      reason:
        description: 'Why are we deploying?'
        required: false
        default: 'Regular update'

permissions:
  contents: 'read'
  id-token: 'write'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/backend-test.yaml

  deploy:
    needs: test
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Set up Node (frontend)'
        uses: actions/setup-node@v4
        if: inputs.deploy_frontend
        with:
          node-version: 22 # Vite 8 needs Node 20.19+ or 22.12+
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 'Build Frontend (PROD)'
        if: inputs.deploy_frontend
        working-directory: frontend
        # no VITE_API_BASE_URL override: Vite picks the PROD backend URL from frontend/.env.production
        run: |
          npm ci
          npm run build
      - name: Create Env File from Secret
        run: |
          echo "${{ secrets.BACKEND_ENV_PROD }}" > backend/env.yaml     
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: 'github-actions-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: 'Copy Web Server Dockerfile'
        if: inputs.deploy_web
        run: cp backend/web-server/Dockerfile backend/Dockerfile

      # Deploy Web Server
      - name: 'Deploy Web Server (PROD)'
        if: inputs.deploy_web
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: 'backend-prod'
          source: './backend' # include all backend to include shared libs
          region: 'europe-southwest1' # web server is in europe-southwest1
          env_vars_file: 'backend/env.yaml'

      # Deploy Scraper (Job)
      - name: 'Deploy Scraper Job (PROD)'
        if: inputs.deploy_scraper
        run: |  # scraper is in europe-west1 
          cp backend/scraper/Dockerfile backend/Dockerfile
          gcloud run jobs deploy scraper-job-prod \
            --source ./backend \
            --region europe-west1 \
            --env-vars-file backend/env.yaml \
            --quiet

      # Deploy Frontend (Firebase Hosting)
      - name: 'Deploy Frontend to Firebase Hosting (prod)'
        if: inputs.deploy_frontend
        run: npx --yes firebase-tools@15.35.0 deploy --only hosting:prod --project pt-train-delays --non-interactive
